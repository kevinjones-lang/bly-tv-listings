<div id="bar"></div><div id="asof"></div><div id="err"></div><div id="hint">&larr; &rarr; navigate &middot; F fullscreen</div></div><script>
const FEED_ID='1rFoocO92dt3iqswf6IH6-oML7ZfhzdOAcVli5ujVJYU';
const P=new URLSearchParams(location.search);
const BASE='https://docs.google.com/spreadsheets/d/'+FEED_ID;
const URLS=P.get('feed')?[P.get('feed')]:[BASE+'/gviz/tq?tqx=out:csv&headers=1', BASE+'/export?format=csv'];

 if(fit){tr.lastElementChild.remove();return}
 tr.style.setProperty('--rdur',(h/(window.innerWidth/1920*38)).toFixed(1)+'s');tr.classList.add('run');
 tr.addEventListener('animationiteration',cycle)}
let cycling=false;async function cycle(){if(cycling)return;cycling=true;try{await Promise.all([refreshLB(),loadTraining(),loadMarket()]);if(lbData)lbD=lbData;drawMTD();drawYTD()}finally{cycling=false}}
function dealsRank(mode){const rows=(lbD&&lbD.deals&&Array.isArray(lbD.deals.ytd)?lbD.deals.ytd:[]).filter(a=>isAgent(a)&&!(lbD.deals.exclude||[]).map(x=>x.toLowerCase()).includes(String(a.name).toLowerCase()));
 const s=rows.slice().sort(mode?(a,b)=>b.closed-a.closed||b.volume-a.volume:(a,b)=>b.volume-a.volume||b.closed-a.closed);return s.slice(0,3).map((a,k)=>({...a,rank:k+1}))}
const vtxt=a=>a.volumeText||('$'+(a.volume/1e6).toFixed(1)+'M');
function drawYTD(){const el=document.getElementById('ytdb');const d=lbD&&lbD.deals&&lbD.deals.ytd&&lbD.deals.ytd.length;
 document.getElementById('ytda').textContent=d&&lbD.dealsAsOf?'Closed deals \u00b7 as of '+lbAsOf(lbD.dealsAsOf):'';
 if(!d){ytdKey='';el.innerHTML='<div class="ywait">YTD standings loading</div>';return}
 const key=JSON.stringify(lbD.deals);if(key!==ytdKey){ytdKey=key;
  const pane=(mode)=>`<div class="ypane${mode===ytdMode?' on':''}" data-mode="${mode}"><div class="y3">${dealsRank(mode).map(a=>`<div class="yc r${a.rank}"><div class="yn">${esc(a.name)}</div>${head(a,1)}<div class="yt"><div class="yv">${mode?fmtN(a.closed):esc(vtxt(a))}</div><div class="yl">${mode?'closings':'sales volume'}</div><div class="ysub">${mode?esc(vtxt(a))+' volume':fmtN(a.closed)+' closings'}</div>${a.dealAvgText?'<div class="ysub">'+esc(a.dealAvgText)+' avg deal</div>':''}</div></div>`).join('')}</div></div>`;
  el.innerHTML=pane(0)+pane(1)}
 document.getElementById('ytdh').textContent=ytdMode?'Top 3 YTD Closings':'Top 3 YTD Sales Volume'}
function ytdFlip(){ytdMode^=1;document.querySelectorAll('.ypane').forEach(p=>p.classList.toggle('on',+p.dataset.mode===ytdMode));const h=document.getElementById('ytdh');h.classList.add('fade');setTimeout(()=>{h.textContent=ytdMode?'Top 3 YTD Closings':'Top 3 YTD Sales Volume';h.classList.remove('fade')},500)}
function clock(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'})}

// ---- News ticker (market.json + training.json) ----
const TR_URL=P.get('training')||'training.json',MK_URL=P.get('market')||'market.json';let trKey='',trEv=[],mkHead=[];
function tDate(iso,allDay){const d=new Date(iso),o={timeZone:'America/Chicago'};const day=d.toLocaleDateString('en-US',{...o,weekday:'short',month:'short',day:'numeric'}).replace(',','');return allDay?day+' \u00b7 All day':day+' \u00b7 '+d.toLocaleTimeString('en-US',{...o,hour:'numeric',minute:'2-digit'})}
function renderTicker(){const key=JSON.stringify({m:mkHead,t:trEv});if(key===trKey)return;trKey=key;
 const win=document.getElementById('twin');
 const mItems=(mkHead||[]).map(h=>`<span class="ti"><span class="mkb">MARKET</span><span class="n">${esc(h.text||'')}</span></span>`).join('');
 const tItems=(trEv||[]).map(e=>`<span class="ti"><span class="d">${esc(tDate(e.start,e.allDay))}</span><span class="n">${esc(e.title)}</span>${e.where?`<span class="w">\u00b7 ${esc(e.where)}</span>`:''}${e.detail?`<span class="x">\u00b7 ${esc(e.detail)}</span>`:''}</span>`).join('');
 const items=mItems+tItems;
 if(!items){win.innerHTML='<div class="tnone">No upcoming classes scheduled</div>';return}
 win.innerHTML=`<div class="ttrack" id="ttrack">${items}${items}</div>`;
 const tr=document.getElementById('ttrack');const px=tr.scrollWidth/2,speed=window.innerWidth/1920*130;tr.style.setProperty('--dur',(px/speed).toFixed(1)+'s');tr.classList.add('run')}
async function loadMarket(){try{const j=await getJSON(MK_URL);mkHead=(j.headlines||[]);localStorage.setItem('blyMk1',JSON.stringify(j))}catch(e){console.warn('market failed',e);try{const c=JSON.parse(localStorage.getItem('blyMk1'));mkHead=(c&&c.headlines)||mkHead||[]}catch(_){mkHead=mkHead||[]}}
 renderTicker()}
async function loadTraining(){let ev=null;try{const j=await getJSON(TR_URL);ev=(j.events||[]);localStorage.setItem('blyTr1',JSON.stringify(j))}catch(e){console.warn('training failed',e);try{const c=JSON.parse(localStorage.getItem('blyTr1'));ev=c&&c.events}catch(_){}}
 const now=Date.now();trEv=(ev||[]).filter(e=>new Date(e.end||e.start).getTime()>=now).slice(0,40);
 renderTicker()}
async function startDash(){document.body.classList.add('dashmode');
 document.getElementById('dash').innerHTML=`<div class="dl"><div class="dlh"><div><div class="logo"><img src="img/logo.png" alt="The Bly Team | eXp Realty"></div><div class="sub">Now Listed \u00b7 <span id="lcount"></span></div></div><div><div class="clk" id="clk"></div><div class="pg" id="lpg"></div></div></div><div class="rows" id="rows"></div><div class="dlf"><span id="lasof"></span><span>eXp Realty</span></div></div>
 <div class="dr"><div class="mtd"><div class="ph"><h2 id="mtdt">October MTD Leaderboard</h2><span id="mtda"></span></div><div class="mtot" id="mtdtot"></div><div class="roll" id="roll"></div></div>
 <div class="ytd"><div class="ph"><h2 id="ytdh">Top 3 YTD Sales Volume</h2><span id="ytda"></span></div><div id="ytdb" style="flex:1;position:relative;min-height:0"></div></div></div><div class="tick"><div class="tlab">NEWS</div><div class="twin" id="twin"></div></div>`;
 clock();setInterval(clock,10000);
 await Promise.all([loadListings(),refreshLB(),loadTraining(),loadMarket()]);lbD=lbData;drawRows();drawMTD();drawYTD();
 setInterval(boardTick,DSECS);setInterval(ytdFlip,(+P.get('ysecs')||15)*1000);setInterval(()=>{if(!document.querySelector('#rtrack.run'))cycle()},120000);document.body.dataset.ready='1'}
if(VIEW==='classic')refresh().then(()=>{document.body.dataset.ready='1';show(+P.get('slide')||0)});
else startDash();
</script></body></html>
