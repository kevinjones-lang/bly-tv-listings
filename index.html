</style></head><body><div id="stage"><div id="slides"></div>
<div id="bar"></div><div id="asof"></div><div id="err"></div><div id="hint">&larr; &rarr; navigate &middot; F fullscreen</div></div><script>

", "Vacant"], ["2336 Fairwind Road, Houston", "$276,500", "2/2 & 2/1", "1,343", "49", "Occupied"], ["8423 Venus St, Houston (Lot)", "$52,000", "N/A", "0.1263 Acres", "225", "Vacant"], ["2619 Bellview Street, La Marque", "$149,700", "2/2 & 1/1", "1,008", "195", "Vacant"], ["10112 Hermann Trace, Texas City", "$355,000", "4/4 & 2/1", "2,629", "35", "Occupied"], ["21155 Armstrong County Drive, Cypress", "$320,000", "4 & 2", "1,781", "137", "Vacant"], ["3502 Magnolia Avenue, Texas City", "$188,000", "3 & 1/0", "975", "158", "Vacant"], ["9621 Wall St, Texas City", "$315,000", "4/4 & 2/0", "2,033", "90", "Occupied"], ["16614 Hamill Drive, Rosharon (Lot)", "$158,000", "N/A", "2 Acres", "35", "Vacant"], ["18515 Egret Bay Blvd #1103, Webster", "$124,000", "2/2 & 2", "864", "14", "Vacant"], ["3134 California Avenue, Cleveland", "$290,000", "3 & 2", "1,440", "62", "Vacant"], ["1225 N Riviera Cir, Pearland", "$318,000", "3/3 & 2", "1,701", "55", "Vacant"], ["7108 E Hunter Drive, Hitchcock", "$289,999", "2/2 & 1/1", "1,200", "48", "Vacant"], ["874 Pebblebank Lane, League City", "$499,999", "5/5 & 3/1", "3,303", "28", "Vacant"], ["1407 Miller Street, Houston (Lot)", "$240,000", "N/A", "0.1226 acres", "249", "Vacant"], ["1220 Crystal Dunes Way, Crystal Beach (Lot)", "$329,000", "N/A", "0.877 acres", "26", "Vacant"], ["218 Shady Oaks, Alvin", "$89,995", "1 & 1", "384", "113", "Occupied"], ["1928 Purswell Road, Houston", "$399,000", "3/3 & 3/1", "2,524", "297", "Vacant"]];
// Only these client-safe fields are ever read from the feed (matched by header name).
const SAFE=[['address','address'],['price','list price'],['bb','bed/bath'],['size','sq ft'],['dom','dom'],['occ','vacant']];
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
 else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}
 if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function toListings(text){const rows=parseCSV(text);if(rows.length<2)throw Error('empty feed');
 const h=rows[0].map(x=>x.trim().toLowerCase());const idx={};
 for(const[k,p]of SAFE){const j=h.findIndex(x=>x.startsWith(p));if(j<0)throw Error('missing column '+p);idx[k]=j}
 const out=[];for(const r of rows.slice(1)){const o={};for(const k in idx)o[k]=(r[idx[k]]||'').replace(/\s+/g,' ').trim();
  if(o.address&&o.price&&o.address.toLowerCase()!=='address')out.push(o)}
 if(!out.length)throw Error('no listings');return out}
const fromSnap=()=>SNAPSHOT.map(a=>({address:a[0],price:a[1],bb:a[2],size:a[3],dom:a[4],occ:a[5]}));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function money(v){if(/^\d+(\.\d+)?$/.test(v))return '$'+Number(v).toLocaleString('en-US');return v}
function num(v){return /^\d+$/.test(v)?Number(v).toLocaleString('en-US'):v}
async function fetchFeed(){let last;for(const u of URLS){try{const r=await fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
 if(!r.ok)throw Error('HTTP '+r.status);const t=await r.text();if(/^\s*</.test(t))throw Error('not CSV (sheet not public?)');return toListings(t)}catch(e){last=e}}throw last}
let data=null,S=[],i=0,t;const stage=document.getElementById('slides'),bar=document.getElementById('bar');
function render(L){const n=L.length;let h=`<section class="slide title"><div class="tbrand">eXp Realty</div><h1>The Bly Team</h1><div class="rule"></div><h2>Active Listings</h2><p class="tsub">League City &middot; Houston &middot; Galveston County</p><p class="tcount">${n} properties</p></section>`;
 L.forEach((r,k)=>{const c=r.address.indexOf(',');const street=c<0?r.address:r.address.slice(0,c),city=c<0?'':r.address.slice(c+1).trim();
  const size=num(r.size),sl=/acre/i.test(size)?'Lot Size':'Sq Ft';const occ=r.occ||'';const oc='occ-'+(occ.split(' ')[0]||'').toLowerCase();
  const st=[['Bed / Bath',r.bb],[sl,size],['Days on Market',r.dom]].filter(x=>x[1]).map(([a,b])=>`<div class="stat"><div class="sv">${esc(b)}</div><div class="sl">${esc(a)}</div></div>`).join('');
  h+=`<section class="slide listing"><div class="top"><span class="chip">Listing ${k+1} of ${n}</span>${occ?`<span class="chip ${esc(oc)}">${esc(occ)}</span>`:''}</div><div class="main"><div class="street">${esc(street)}</div><div class="city">${esc(city)}</div><div class="price">${esc(money(r.price))}</div><div class="stats">${st}</div></div><div class="foot"><div class="brand">The Bly Team &middot; eXp Realty</div></div></section>`});
 stage.innerHTML=h;S=[...stage.querySelectorAll('.slide')];document.body.dataset.count=n}
function show(n){S.forEach(s=>s.classList.remove('active'));i=(n+S.length)%S.length;S[i].classList.add('active');restart()}
function restart(){clearTimeout(t);bar.style.transition='none';bar.style.width='0';void bar.offsetWidth;bar.style.transition='width '+D+'ms linear';bar.style.width='100%';t=setTimeout(next,D)}
async function next(){if(i===S.length-1){await refresh();show(0)}else show(i+1)}
function stamp(src,when){document.getElementById('asof').textContent=src==='live'?'Updated '+when.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}
async function refresh(){try{const L=await fetchFeed();data=L;localStorage.setItem('blyLast',JSON.stringify({t:Date.now(),L}));render(L);stamp('live',new Date());document.getElementById('err').textContent=''}
 catch(e){console.warn('feed failed',e);if(!data){let c=null;try{c=JSON.parse(localStorage.getItem('blyLast'))}catch(_){}data=c&&c.L&&c.L.length?c.L:fromSnap();render(data)}
  document.getElementById('err').textContent='\u25CF offline \u2013 showing last saved data';document.body.dataset.feedError=e.message}}
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen()}
document.addEventListener('keydown',ev=>{const k=ev.key;if(k==='ArrowRight'||k===' '||k==='PageDown'){next();ev.preventDefault()}else if(k==='ArrowLeft'||k==='PageUp')show(i-1);else if(k==='f'||k==='F')fs();else if(k==='Home')show(0)});
document.addEventListener('dblclick',fs);
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity=0},6000);

refresh().then(()=>{document.body.dataset.ready='1';show(+P.get('slide')||0)});
